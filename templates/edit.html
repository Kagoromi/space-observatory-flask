{% extends "base.html" %}

{% block title %}Edit Item{% endblock %}

{% block content %}
<h2>Edit Observatory Record</h2>

<form action="{{ url_for('edit_item', item_id=item.id) }}" method="POST" class="form-container">
    <div class="form-group">
        <label>Object Title</label>
        <input type="text" name="title" value="{{ item.title }}" required>
    </div>
    
    <div class="form-group">
        <label>Research Center</label>
        <input type="text" name="center" value="{{ item.center }}" required>
    </div>

    <!-- Edit domain specific notes field -->
    <div class="form-group">
        <label>Astronomer Notes</label>
        <textarea name="notes" rows="4">{{ item.notes }}</textarea>
    </div>
    
    <button type="submit" class="btn">Save Changes</button>
    <a href="{{ url_for('saved') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
